<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechnoMarket — Strona główna</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 26px; }
    .banner { width: 100%; border-radius: 6px; margin: 20px 0; }
    .products { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
    .product { border: 1px solid #eee; border-radius: 6px; padding: 12px; width: 200px; }
    .product h3 { font-size: 15px; margin: 8px 0 4px; }
    .product p { font-size: 13px; color: #555; margin: 2px 0; }
  </style>
</head>
<body>
  <h1>TechnoMarket</h1>
  <p>Twoje centrum elektroniki i technologii. Sprawdź nasze najnowsze promocje.</p>

  <img class="banner" src="images/zt08_encoded_whisper.png" alt="Baner promocyjny - wyprzedaz technologiczna">

  <div class="products">
    <div class="product">
      <h3>Laptop UltraBook Pro 15</h3>
      <p>4299 zł</p>
      <p>Ocena: 4.6/5</p>
    </div>
    <div class="product">
      <h3>Monitor 27" QHD</h3>
      <p>899 zł</p>
      <p>Ocena: 4.4/5</p>
    </div>
    <div class="product">
      <h3>Klawiatura mechaniczna</h3>
      <p>349 zł</p>
      <p>Ocena: 4.8/5</p>
    </div>
  </div>

  <p style="margin-top: 30px; font-size: 13px; color: #888;">© 2026 TechnoMarket. Wszystkie ceny zawierają VAT.</p>
</body>
</html>
